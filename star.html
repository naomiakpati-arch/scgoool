<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Path</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #070d1c 0%, #1a1638 100%);
      color: #f2ebff;
      font-family: Georgia, "Times New Roman", serif;
    }
    .card {
      width: min(700px, 90vw);
      background: rgba(22, 18, 40, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,0.4);
    }
    h1 {
      margin-top: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #d9d6ef;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #d8b4ff, #f5d0fe);
      color: #111827;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Moon Path</h1>
    <p>You follow the glowing moon across the night and find a quiet trail of silver light.</p>
    <a href="index.html">Return Home</a>
  </main>
</body>
</html>
